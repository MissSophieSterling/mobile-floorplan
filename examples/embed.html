<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed demo · Mobile Floorplan</title>
<style>
  :root{ --bg:#f5f6f8; --ink:#17202b; --dim:#5f6b7a; --line:#d9dee6; --card:#fff; --accent:#0a7d55; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#101318; --ink:#e8ecf2; --dim:#9aa5b4; --line:#2c3440; --card:#181c23; --accent:#35c08c; } }
  body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:960px; margin:0 auto; padding:16px}
  h1{font-size:20px; margin:4px 0 2px}
  p{color:var(--dim); margin:0 0 12px}
  #planner{height:70vh; min-height:480px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff}
  .bar{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0}
  button{height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; font-weight:600; cursor:pointer}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  pre{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; overflow:auto; max-height:220px; font-size:12px}
</style>
</head>
<body>
<main>
  <h1>“Acme Movers”: example host app</h1>
  <p>This page stands in for someone else's app. It embeds the editor with the SDK, gets change events, and asks for exported files without leaving the page.</p>
  <div id="planner"></div>
  <div class="bar">
    <button class="primary" id="pdf">Get PDF</button>
    <button id="png">Get PNG</button>
    <button id="dxf">Get DXF</button>
    <button id="ft">Switch to feet</button>
    <button id="link">Open as a link-out instead</button>
  </div>
  <pre id="log">Waiting for the editor…</pre>
</main>

<script src="../sdk/mobile-floorplan-sdk.js"></script>
<script>
  const log = t => { const el = document.getElementById('log'); el.textContent = t + '\n' + el.textContent; };
  const saved = JSON.parse(localStorage.getItem('acme-plan') || 'null');

  const editor = MobileFloorplan.embed('#planner', {
    src: '../',                       // on your site: leave this out to use the hosted editor
    units: 'm',
    name: 'Customer home',
    formats: ['png', 'pdf', 'dxf', 'json'],
    plan: saved,
    onReady:  plan => log('Ready. Floors: ' + plan.floors.length),
    onChange: plan => { localStorage.setItem('acme-plan', JSON.stringify(plan)); log('Change saved (' + plan.floors[0].items.length + ' items on first floor)'); },
    onSave:   plan => log('User tapped Done. Rooms: ' + plan.floors.flatMap(f => f.items).filter(i => i.kind === 'room').length),
  });

  async function grab(format){
    try {
      const {blob, filename} = await editor.export(format);
      log(`Received ${filename} (${Math.round(blob.size/1024)} KB) from the editor`);
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    } catch (e) { log('Export failed: ' + e.message); }
  }
  document.getElementById('pdf').onclick = () => grab('pdf');
  document.getElementById('png').onclick = () => grab('png');
  document.getElementById('dxf').onclick = () => grab('dxf');
  document.getElementById('ft').onclick = () => editor.setOptions({units: 'ft'}).then(() => log('Units set to feet'));
  document.getElementById('link').onclick = async () => {
    const plan = await editor.getPlan();
    location.href = MobileFloorplan.linkUrl({src: '../', returnUrl: location.href.split('#')[0], plan});
  };

  // Coming back from the link-out flow?
  const back = MobileFloorplan.readReturn();
  if (back) { localStorage.setItem('acme-plan', JSON.stringify(back)); editor.load(back); log('Plan came back from the link-out'); history.replaceState(null, '', location.pathname); }
</script>
</body>
</html>
